name: Scan and deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: ACR image tag to scan and deploy (normally a commit SHA)
        required: true
        type: string
      aks_cluster_name:
        description: Name of the target AKS cluster
        required: true
        type: string
      azure_resource_group:
        description: Azure Resource Group containing the AKS cluster
        required: true
        type: string
      kubernetes_namespace:
        description: Kubernetes namespace for the application
        required: true
        default: image-trust-demo
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.aks_cluster_name }}-${{ inputs.kubernetes_namespace }}
  cancel-in-progress: false

jobs:
  scan-image:
    name: Pull, scan, and trust ACR image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
      image_digest: ${{ steps.image.outputs.digest }}
      trusted_image_tagged: ${{ steps.wiz_tag.outputs.trusted_image_tagged }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      REPORT_DIR: /tmp/wiz-image-reports
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME ACR_LOGIN_SERVER ACR_REPOSITORY IMAGE_TAG; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub configuration: $name" >&2; exit 2; }
          done
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "image_tag is not a valid container tag" >&2
            exit 2
          }
          mkdir -p "$REPORT_DIR"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "${ACR_REPOSITORY}:${IMAGE_TAG}" \
            --query digest \
            --output tsv)
          [[ "$digest" == sha256:* ]] || { echo "Could not resolve ACR image digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "uri=$ACR_LOGIN_SERVER/$ACR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Pull image from ACR
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_URI"

      - name: Scan image with Wiz
        uses: wizorganization/wiz-workflows/.github/actions/wiz-image-scan@142a8d3f68adb2357097a8c0a07c5ca9c010481d # v1
        with:
          image: ${{ steps.image.outputs.uri }}
          scan_types: all
          dockerfile: ""
          publish: "true"
          fail_on_policy: "true"
          report_dir: ${{ env.REPORT_DIR }}
          wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
          wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Refresh Wiz Image Trust registration
        id: wiz_tag
        uses: wizorganization/wiz-workflows/.github/actions/wiz-image-tag@63f6022dbbc90eb42a53cef4f32c5607f0e438ec # v1
        with:
          image: ${{ steps.image.outputs.uri }}
          image_digest: ${{ steps.image.outputs.digest }}
          report_dir: ${{ env.REPORT_DIR }}
          wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
          wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Log out of ACR
        if: always()
        continue-on-error: true
        shell: bash
        run: docker logout "$ACR_LOGIN_SERVER"

      - name: Upload Wiz image reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('wiz-deploy-image-{0}-{1}-{2}', github.repository_id, github.run_id, github.run_attempt) }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy approved digest to AKS
    needs: scan-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AKS_CLUSTER_NAME: ${{ inputs.aks_cluster_name }}
      AZURE_RESOURCE_GROUP: ${{ inputs.azure_resource_group }}
      KUBERNETES_NAMESPACE: ${{ inputs.kubernetes_namespace }}
      IMAGE_URI: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_REPOSITORY }}@${{ needs.scan-image.outputs.image_digest }}
      TRUSTED_IMAGE_TAGGED: ${{ needs.scan-image.outputs.trusted_image_tagged }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AKS_CLUSTER_NAME AZURE_RESOURCE_GROUP KUBERNETES_NAMESPACE IMAGE_URI; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub configuration: $name" >&2; exit 2; }
          done
          [[ "$AKS_CLUSTER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$ ]] || {
            echo "aks_cluster_name is invalid" >&2
            exit 2
          }
          [[ "$KUBERNETES_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ && ${#KUBERNETES_NAMESPACE} -le 63 ]] || {
            echo "kubernetes_namespace must be a valid DNS label" >&2
            exit 2
          }
          [[ "$TRUSTED_IMAGE_TAGGED" == "true" ]] || {
            echo "The Wiz tag action did not confirm Image Trust registration" >&2
            exit 1
          }

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Connect to AKS cluster
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy application and Ingress
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace "$KUBERNETES_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          sed "s|IMAGE_URI_PLACEHOLDER|$IMAGE_URI|g" k8s/application.yaml |
            kubectl --namespace "$KUBERNETES_NAMESPACE" apply -f -
          kubectl --namespace "$KUBERNETES_NAMESPACE" rollout status \
            deployment/image-trust-demo --timeout=5m

      - name: Wait for Public Ingress / LoadBalancer IP
        shell: bash
        run: |
          set -euo pipefail
          ingress_target=""
          for _ in $(seq 1 60); do
            ingress_ip=$(kubectl --namespace "$KUBERNETES_NAMESPACE" get ingress image-trust-demo \
              --output jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            ingress_host=$(kubectl --namespace "$KUBERNETES_NAMESPACE" get ingress image-trust-demo \
              --output jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            
            if [[ -n "$ingress_ip" ]]; then
              ingress_target="$ingress_ip"
              break
            elif [[ -n "$ingress_host" ]]; then
              ingress_target="$ingress_host"
              break
            fi
            sleep 10
          done
          [[ -n "$ingress_target" ]] || {
            kubectl --namespace "$KUBERNETES_NAMESPACE" describe ingress image-trust-demo
            echo "The cluster did not publish an Ingress IP/Hostname within 10 minutes" >&2
            exit 1
          }
          {
            echo "## Deployed image to AKS"
            echo
            echo "\`$IMAGE_URI\`"
            echo
            echo "Public URL: http://$ingress_target"
          } >> "$GITHUB_STEP_SUMMARY"
